<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commander Partner Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --dark: #0d0d0d;
    --surface: #111820;
    --surface2: #1a2433;
    --surface3: #0c1219;
    --white: #f5f0e8;
    --border: rgba(201,168,76,0.22);
    --border-hover: rgba(201,168,76,0.55);

    /* Dynamic accent colors — overridden by JS */
    --accent1: #8b1a1a;
    --accent2: #1a3a5c;
    --accent3: #2a6a3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 15% 15%, rgba(var(--accent1-rgb), 0.13) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(var(--accent2-rgb), 0.16) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
    transition: background 0.6s;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 1140px;
    margin: 0 auto;
    padding: 2rem 1.5rem 5rem;
  }

  /* ── Identity picker ── */
  #identity-screen {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2.5rem;
    padding: 3rem 1.5rem;
  }

  #identity-screen h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.5rem, 5vw, 2.6rem);
    color: var(--gold);
    text-shadow: 0 0 50px rgba(201,168,76,0.3);
    letter-spacing: 0.04em;
    text-align: center;
  }

  #identity-screen p {
    color: rgba(245,240,232,0.45);
    font-style: italic;
    font-size: 1.05rem;
    text-align: center;
    max-width: 480px;
  }

  /* Color pip toggles */
  .color-picker {
    display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center;
  }

  .color-toggle {
    display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
    cursor: pointer; user-select: none;
  }

  .color-toggle input { display: none; }

  .color-pip-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.4rem;
    border: 3px solid rgba(255,255,255,0.15);
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, opacity 0.15s;
    opacity: 0.38;
  }

  .color-toggle input:checked + .color-pip-btn {
    opacity: 1;
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 20px rgba(255,255,255,0.15);
    transform: scale(1.08);
  }

  .color-toggle:hover .color-pip-btn { opacity: 0.7; transform: scale(1.04); }
  .color-toggle input:checked + .color-pip-btn:hover { opacity: 1; transform: scale(1.12); }

  .pip-W { background: #e8e4cc; color: #2a2200; }
  .pip-U { background: #1a5a9c; color: #fff; }
  .pip-B { background: #1a1020; color: #c8a0e8; border-color: rgba(200,160,232,0.3) !important; }
  .pip-R { background: #9c1a1a; color: #fff; }
  .pip-G { background: #1a6a2a; color: #fff; }

  .color-label { font-size: 0.78rem; color: rgba(245,240,232,0.45); letter-spacing: 0.06em; }

  /* Nickname presets */
  .preset-row {
    display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
    max-width: 640px;
  }

  .preset-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: rgba(245,240,232,0.65);
    font-family: 'Crimson Pro', serif;
    font-size: 0.85rem;
    padding: 0.3rem 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .preset-btn:hover { border-color: var(--border-hover); color: var(--gold); background: var(--surface2); }

  /* Go button */
  #go-btn {
    background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.08));
    border: 1px solid rgba(201,168,76,0.5);
    border-radius: 8px;
    color: var(--gold);
    font-family: 'Cinzel Decorative', serif;
    font-size: 1rem;
    letter-spacing: 0.08em;
    padding: 0.75rem 2.5rem;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  #go-btn:hover {
    background: linear-gradient(135deg, rgba(201,168,76,0.28), rgba(201,168,76,0.14));
    box-shadow: 0 0 24px rgba(201,168,76,0.2);
    transform: scale(1.03);
  }
  #go-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

  .identity-preview {
    display: flex; gap: 0.5rem; align-items: center; min-height: 28px;
  }

  /* Mechanic scanner */
  #scan-area { text-align: center; }
  .scan-btn {
    background: none; border: none;
    color: rgba(245,240,232,0.28);
    font-family: 'Crimson Pro', serif; font-size: 0.82rem; font-style: italic;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    transition: color 0.15s;
  }
  .scan-btn:hover { color: rgba(245,240,232,0.55); }
  .scan-btn:disabled { cursor: default; }
  #scan-result {
    margin-top: 0.55rem; font-size: 0.83rem; line-height: 1.6;
  }
  .scan-ok   { color: #7ad09a; }
  .scan-warn { color: #e0b06a; }

  /* ── Results screen ── */
  #results-screen { display: none; }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .mana-display {
    display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 0.9rem; flex-wrap: wrap;
  }

  .mpip {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem;
    border: 2px solid rgba(255,255,255,0.25);
    transition: transform 0.3s;
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.3rem, 4vw, 2rem);
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.28);
    letter-spacing: 0.04em; line-height: 1.2; margin-bottom: 0.35rem;
  }

  .subtitle { color: rgba(245,240,232,0.42); font-style: italic; font-size: 0.97rem; }

  .back-btn {
    position: absolute; top: 0; left: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: rgba(245,240,232,0.5);
    font-family: 'Crimson Pro', serif; font-size: 0.85rem;
    padding: 0.35rem 0.85rem; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-btn:hover { color: var(--gold); border-color: var(--border-hover); }

  /* ── Status ── */
  #status-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.85rem 1.3rem; margin-bottom: 1.75rem;
    font-size: 0.91rem; color: var(--gold-light);
    display: flex; align-items: center; gap: 0.7rem;
  }
  .spinner {
    width: 14px; height: 14px; flex-shrink: 0;
    border: 2px solid rgba(201,168,76,0.22);
    border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Controls ── */
  .controls {
    display: flex; flex-wrap: wrap; gap: 0.65rem;
    margin-bottom: 1.75rem; align-items: center;
  }
  .filter-group {
    display: flex; align-items: center; gap: 0.42rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.36rem 0.72rem; font-size: 0.87rem;
  }
  .filter-group label { color: rgba(245,240,232,0.52); white-space: nowrap; }
  select, input[type="text"] {
    background: transparent; border: none; color: var(--white);
    font-family: 'Crimson Pro', serif; font-size: 0.92rem;
    outline: none; cursor: pointer;
  }
  select option { background: var(--surface2); }
  input[type="text"] { width: 165px; padding: 0.08rem 0; border-bottom: 1px solid var(--border); }
  .count-badge {
    margin-left: auto; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 0.26rem 0.95rem; font-size: 0.82rem; color: var(--gold); white-space: nowrap;
  }

  /* ── Sections ── */
  .section { margin-bottom: 2.75rem; }
  .section-header {
    display: flex; align-items: baseline; gap: 1rem;
    margin-bottom: 1.05rem; padding-bottom: 0.42rem;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.93rem; color: var(--gold); letter-spacing: 0.05em;
  }
  .section-count { font-size: 0.82rem; color: rgba(245,240,232,0.35); font-style: italic; }

  /* ── Group rows ── */
  .groups-list { display: flex; flex-direction: column; gap: 0.5rem; }

  .group-item {
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    transition: border-color 0.2s; outline: none;
  }
  .group-item:focus, .group-item.focused { border-color: var(--border-hover); box-shadow: 0 0 0 2px rgba(201,168,76,0.16); }
  .group-item.open { border-color: var(--border-hover); }

  .group-header {
    background: var(--surface); padding: 0.76rem 1.15rem;
    display: flex; align-items: center; gap: 0.85rem;
    cursor: pointer; user-select: none; transition: background 0.15s;
  }
  .group-header:hover { background: var(--surface2); }

  .anchor-name { font-size: 0.98rem; font-weight: 600; color: var(--white); flex-shrink: 0; }

  .partner-preview {
    flex: 1; font-size: 0.86rem; color: rgba(245,240,232,0.46);
    font-style: italic; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .partner-preview em { color: rgba(245,240,232,0.72); font-style: normal; }

  .group-badges { display: flex; align-items: center; gap: 0.42rem; flex-shrink: 0; }

  .partner-counter {
    font-size: 0.76rem; color: rgba(201,168,76,0.62);
    background: rgba(201,168,76,0.07); border: 1px solid rgba(201,168,76,0.18);
    border-radius: 20px; padding: 0.13rem 0.55rem; white-space: nowrap;
  }

  .mechanic-tag {
    font-size: 0.67rem; padding: 0.15rem 0.46rem;
    border-radius: 3px; font-family: 'Crimson Pro', serif;
    letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; white-space: nowrap;
  }

  /* tag-solo is not in PARTNER_TYPES so stays here */
  .tag-solo { background: rgba(80,70,10,0.6); color: #d4c45a; border: 1px solid rgba(212,196,90,0.3); }

  /* All other .tag-* rules are injected from PARTNER_TYPES at runtime */

  .identity-pips { display: flex; gap: 3px; }
  .ipip {
    width: 13px; height: 13px; border-radius: 50%; font-size: 0.52rem;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; border: 1px solid rgba(255,255,255,0.16);
  }

  .chevron {
    color: rgba(201,168,76,0.42); font-size: 0.77rem;
    transition: transform 0.2s, color 0.2s; flex-shrink: 0;
  }
  .group-item.open .chevron { transform: rotate(180deg); color: var(--gold); }

  /* ── Drawer ── */
  .group-drawer {
    display: none; background: var(--surface3); border-top: 1px solid var(--border);
  }
  .group-item.open .group-drawer { display: block; }

  .drawer-inner { display: flex; align-items: stretch; min-height: 340px; }

  .panel-anchor {
    flex: 0 0 220px; padding: 1.3rem 1rem 1.3rem 1.4rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
    border-right: 1px solid var(--border);
  }

  .panel-partner { flex: 1; display: flex; flex-direction: column; }

  .partner-nav {
    display: flex; align-items: center; padding: 0.55rem 0.9rem;
    border-bottom: 1px solid var(--border); gap: 0.55rem;
    background: rgba(0,0,0,0.14);
  }

  .nav-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; color: var(--gold);
    font-size: 0.85rem; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.14s, border-color 0.14s;
    flex-shrink: 0; user-select: none;
  }
  .nav-btn:hover { background: var(--surface2); border-color: var(--border-hover); }
  .nav-btn:disabled { opacity: 0.22; cursor: default; }

  .nav-label { font-size: 0.82rem; color: rgba(245,240,232,0.47); flex: 1; text-align: center; }
  .nav-label strong { color: var(--gold-light); }
  .key-hint { font-size: 0.7rem; color: rgba(245,240,232,0.25); flex-shrink: 0; font-style: italic; }

  .partner-display {
    flex: 1; padding: 1.1rem 1.3rem;
    display: flex; align-items: flex-start; gap: 1.15rem; flex-wrap: wrap;
    transition: opacity 0.12s;
  }

  .card-block { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .card-block img {
    border-radius: 10px; box-shadow: 0 6px 22px rgba(0,0,0,0.62);
    display: block; transition: transform 0.18s, box-shadow 0.18s;
  }
  .card-block img:hover { transform: scale(1.035); box-shadow: 0 11px 36px rgba(0,0,0,0.78); }

  .card-label { font-size: 0.8rem; color: rgba(245,240,232,0.48); font-style: italic; text-align: center; max-width: 175px; }

  .scryfall-btn {
    display: inline-block; font-size: 0.71rem;
    color: rgba(201,168,76,0.52); text-decoration: none;
    border: 1px solid rgba(201,168,76,0.2); border-radius: 4px; padding: 0.17rem 0.48rem;
    transition: color 0.18s, border-color 0.18s;
  }
  .scryfall-btn:hover { color: var(--gold); border-color: var(--gold); }

  .img-placeholder {
    width: 175px; height: 245px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(245,240,232,0.26); font-size: 0.8rem; font-style: italic;
  }

  .partner-info {
    flex: 1; min-width: 130px; padding-top: 0.2rem;
    display: flex; flex-direction: column; gap: 0.52rem;
  }
  .partner-info .pname { font-size: 1.02rem; font-weight: 600; color: var(--white); line-height: 1.3; }
  .partner-info .ptype { font-size: 0.81rem; color: rgba(245,240,232,0.4); font-style: italic; }
  .partner-info .pmechanic-row { display: flex; align-items: center; gap: 0.48rem; flex-wrap: wrap; }
  .partner-info .combined-label { font-size: 0.76rem; color: rgba(245,240,232,0.36); margin-top: 0.18rem; }
  .partner-info .combined-pips { display: flex; gap: 4px; margin-top: 0.08rem; }

  .cpip {
    width: 17px; height: 17px; border-radius: 50%; font-size: 0.62rem;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; border: 1px solid rgba(255,255,255,0.18);
  }

  .solo-drawer-inner {
    display: flex; align-items: flex-start; padding: 1.4rem; gap: 1.4rem; flex-wrap: wrap;
  }

  .error-msg {
    color: #e07a7a; background: rgba(139,26,26,0.16);
    border: 1px solid rgba(139,26,26,0.32); border-radius: 6px;
    padding: 0.9rem 1.3rem; margin-bottom: 1.4rem;
  }
  .empty-state {
    text-align: center; color: rgba(245,240,232,0.28);
    font-style: italic; padding: 2.5rem;
  }
</style>
</head>
<body>
<div class="container">

  <!-- ── SCREEN 1: Identity picker ── -->
  <div id="identity-screen">
    <h1>Commander Partner Finder</h1>
    <p>Choose a color identity to search for every valid commander pairing that resolves to exactly those colors.</p>

    <!-- Quick presets -->
    <div class="preset-row" id="presets"></div>

    <!-- Color toggles -->
    <div class="color-picker">
      <label class="color-toggle">
        <input type="checkbox" value="W" onchange="onColorChange()">
        <div class="color-pip-btn pip-W">W</div>
        <span class="color-label">White</span>
      </label>
      <label class="color-toggle">
        <input type="checkbox" value="U" onchange="onColorChange()">
        <div class="color-pip-btn pip-U">U</div>
        <span class="color-label">Blue</span>
      </label>
      <label class="color-toggle">
        <input type="checkbox" value="B" onchange="onColorChange()">
        <div class="color-pip-btn pip-B">B</div>
        <span class="color-label">Black</span>
      </label>
      <label class="color-toggle">
        <input type="checkbox" value="R" onchange="onColorChange()">
        <div class="color-pip-btn pip-R">R</div>
        <span class="color-label">Red</span>
      </label>
      <label class="color-toggle">
        <input type="checkbox" value="G" onchange="onColorChange()">
        <div class="color-pip-btn pip-G">G</div>
        <span class="color-label">Green</span>
      </label>
    </div>

    <!-- Live identity preview -->
    <div class="identity-preview" id="identity-preview"></div>

    <button id="go-btn" onclick="startSearch()" disabled>Find Commanders</button>

    <!-- New mechanic scanner -->
    <div id="scan-area">
      <button class="scan-btn" onclick="runMechanicScan()">Scan Scryfall for unknown partner mechanics</button>
      <div id="scan-result"></div>
    </div>
  </div>

  <!-- ── SCREEN 2: Results ── -->
  <div id="results-screen">
    <header>
      <button class="back-btn" onclick="goBack()">← Change Identity</button>
      <div class="mana-display" id="mana-display"></div>
      <h1 id="results-title">Commander Finder</h1>
      <p class="subtitle" id="results-subtitle">Every legal pairing resolving to exactly this identity — click a row, then ↑ ↓ to cycle partners</p>
    </header>

    <div id="status-bar">
      <div class="spinner" id="spinner"></div>
      <span id="status-text">Loading…</span>
    </div>
    <div id="error-container"></div>

    <!-- Filter dropdown is populated from PARTNER_TYPES by JS -->
    <div class="controls" id="controls" style="display:none">
      <div class="filter-group">
        <label>Type</label>
        <select id="filter-type" onchange="renderAll()"></select>
      </div>
      <div class="filter-group">
        <label>Search</label>
        <input type="text" id="filter-search" placeholder="card name…" oninput="renderAll()">
      </div>
      <div class="count-badge" id="count-badge">—</div>
    </div>

    <div id="output"></div>
  </div>

</div>
<script>
// ── Color identity data ───────────────────────────────────────────────────────

const COLOR_DATA = {
  W: { label: 'White', bg: '#e8e4cc', fg: '#2a2200', rgb: '232,228,204' },
  U: { label: 'Blue',  bg: '#1a5a9c', fg: '#ffffff', rgb: '26,90,156' },
  B: { label: 'Black', bg: '#1a1020', fg: '#c8a0e8', rgb: '26,16,32' },
  R: { label: 'Red',   bg: '#9c1a1a', fg: '#ffffff', rgb: '156,26,26' },
  G: { label: 'Green', bg: '#1a6a2a', fg: '#ffffff', rgb: '26,106,42' },
};

const COLOR_ORDER = ['W','U','B','R','G'];

const PRESETS = [
  { name: 'Mono-White', colors: ['W'] },
  { name: 'Mono-Blue',  colors: ['U'] },
  { name: 'Mono-Black', colors: ['B'] },
  { name: 'Mono-Red',   colors: ['R'] },
  { name: 'Mono-Green', colors: ['G'] },
  { name: 'Azorius',   colors: ['W','U'] },
  { name: 'Dimir',     colors: ['U','B'] },
  { name: 'Rakdos',    colors: ['B','R'] },
  { name: 'Gruul',     colors: ['R','G'] },
  { name: 'Selesnya',  colors: ['G','W'] },
  { name: 'Orzhov',    colors: ['W','B'] },
  { name: 'Izzet',     colors: ['U','R'] },
  { name: 'Golgari',   colors: ['B','G'] },
  { name: 'Boros',     colors: ['R','W'] },
  { name: 'Simic',     colors: ['G','U'] },
  { name: 'Bant',      colors: ['G','W','U'] },
  { name: 'Esper',     colors: ['W','U','B'] },
  { name: 'Grixis',    colors: ['U','B','R'] },
  { name: 'Jund',      colors: ['B','R','G'] },
  { name: 'Naya',      colors: ['R','G','W'] },
  { name: 'Abzan',     colors: ['W','B','G'] },
  { name: 'Jeskai',    colors: ['U','R','W'] },
  { name: 'Sultai',    colors: ['B','G','U'] },
  { name: 'Mardu',     colors: ['R','W','B'] },
  { name: 'Temur',     colors: ['G','U','R'] },
  { name: 'Artifice',  colors: ['W','U','B','R'] },
  { name: 'Chaos',     colors: ['U','B','R','G'] },
  { name: 'Aggression',colors: ['B','R','G','W'] },
  { name: 'Altruism',  colors: ['R','G','W','U'] },
  { name: 'Growth',    colors: ['G','W','U','B'] },
  { name: 'WUBRG',     colors: ['W','U','B','R','G'] },
];

// ── Partner Mechanic Registry ─────────────────────────────────────────────────
//
// This is the single control center for all partner mechanics.
// To support a new mechanic, add one entry to this array. Everything else
// updates automatically: CSS tag colors, the filter dropdown, section headings,
// detection, and pairing logic.
//
// Fields:
//   key          — internal ID (also used as the CSS class suffix: tag-<key>)
//   label        — short name shown on mechanic tags and in the filter dropdown
//   sectionLabel — heading shown above that group in the results
//   tagBg        — background color of the mechanic tag pill
//   tagColor     — text color of the mechanic tag pill
//   tagBorder    — border color of the mechanic tag pill
//   detect(text) — function: returns true if a card's oracle text has this mechanic
//   pairingRule  — how cards with this mechanic pair up:
//                    'sameGroup'   → any card in the group pairs with any other (generic partner, FF, CS, etc.)
//                    'partnerWith' → fixed named pairs (reads "Partner with [Name]" from oracle text)
//                    'background'  → commander pairs with any Background enchantment
//                    'doctor'      → companion pairs with any Time Lord Doctor
//   namedSubtype — (optional) the exact text after "partner—" as it appears on the card.
//                  Used by the Scryfall scanner to detect subtypes not yet in this list.

const PARTNER_TYPES = [
  {
    key: 'partner',
    label: 'Partner',
    sectionLabel: 'Generic Partner',
    tagBg: 'rgba(26,58,92,0.6)', tagColor: '#7ab3e0', tagBorder: 'rgba(122,179,224,0.3)',
    detect: t =>
      (t.includes('partner (you can have two commanders') || t.includes('partner\n(you can have two commanders'))
      && !t.includes('partner—')
      && !t.includes('partner with ')
      && !t.includes('choose a background')
      && !t.includes("doctor's companion"),
    pairingRule: 'sameGroup',
  },
  {
    key: 'partnerWith',
    label: 'Partner With',
    sectionLabel: 'Partner With (Fixed Pairs)',
    tagBg: 'rgba(60,20,80,0.6)', tagColor: '#c49ae0', tagBorder: 'rgba(196,154,224,0.3)',
    detect: t => t.includes('partner with '),
    pairingRule: 'partnerWith',
  },
  {
    key: 'background',
    label: 'Background',
    sectionLabel: 'Choose a Background',
    tagBg: 'rgba(20,70,30,0.6)', tagColor: '#7ad09a', tagBorder: 'rgba(122,208,154,0.3)',
    detect: t => t.includes('choose a background'),
    pairingRule: 'background',
  },
  {
    key: 'friends',
    label: 'Friends Forever',
    sectionLabel: 'Friends Forever',
    tagBg: 'rgba(80,40,10,0.6)', tagColor: '#e0b06a', tagBorder: 'rgba(224,176,106,0.3)',
    detect: t => t.includes('partner—friends forever') || t.includes('friends forever (you can have two'),

    namedSubtype: 'friends forever',
  },
  {
    key: 'charselect',

    sectionLabel: 'Character Select',
    tagBg: 'rgba(10,60,70,0.6)', tagColor: '#6adce0', tagBorder: 'rgba(106,220,224,0.3)',
    detect: t => t.includes('partner—character select'),

    namedSubtype: 'character select',
  },
  {

    tagBg: 'rgba(50,30,10,0.6)', tagColor: '#d4a06a', tagBorder: 'rgba(212,160,106,0.3)',
    detect: t => t.includes('partner—father & son'),
    pairingRule: 'sameGroup',
    namedSubtype: 'father & son',
  },
  {
    key: 'survivors',
    label: 'Survivors',
    sectionLabel: 'Survivors',
    tagBg: 'rgba(30,50,10,0.6)', tagColor: '#a0d46a', tagBorder: 'rgba(160,212,106,0.3)',
    detect: t => t.includes('partner—survivors'),
    pairingRule: 'sameGroup',
    namedSubtype: 'survivors',
  },
  {
    key: 'doctor',
    label: "Doctor's Companion",
    sectionLabel: "Doctor's Companion",
    tagBg: 'rgba(70,10,10,0.6)', tagColor: '#e07a7a', tagBorder: 'rgba(224,122,122,0.3)',
    detect: t => t.includes("doctor's companion"),

// Derived from the registry — no need to update these manually
const typeOrder = PARTNER_TYPES.map(pt => pt.key);
const sectionMeta = Object.fromEntries(PARTNER_TYPES.map(pt => [
  pt.key,
  { label: pt.sectionLabel, tagClass: `tag-${pt.key}`, tagLabel: pt.label }
]));

// ── Color picker helpers ──────────────────────────────────────────────────────

function getSelectedColors() {
  return [...document.querySelectorAll('.color-picker input:checked')].map(i => i.value);
}

function setColors(colors) {
  document.querySelectorAll('.color-picker input').forEach(i => {
    i.checked = colors.includes(i.value);
  });
  onColorChange();
}

function onColorChange() {
  const sel = getSelectedColors();
  updateIdentityPreview(sel);
  document.getElementById('go-btn').disabled = sel.length === 0;
}

function updateIdentityPreview(colors) {
  const el = document.getElementById('identity-preview');
  if (!colors.length) { el.innerHTML = ''; return; }
  el.innerHTML = COLOR_ORDER.filter(c => colors.includes(c)).map(c => {
    const d = COLOR_DATA[c];
    return `<div style="width:28px;height:28px;border-radius:50%;background:${d.bg};color:${d.fg};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;border:2px solid rgba(255,255,255,0.25)">${c}</div>`;
  }).join('');
}

// ── Utility functions ─────────────────────────────────────────────────────────

function isSubsetOfTarget(s) { for (const c of s) if (!TARGET.has(c)) return false; return true; }
function isExactTarget(s) {
  if (s.size !== TARGET.size) return false;
  for (const c of s) if (!TARGET.has(c)) return false;
  return true;
}
function unionId(a, b) { return new Set([...a, ...b]); }
function colorId(card) { return new Set((card.color_identity || []).map(c => c.toLowerCase())); }
function oracleText(card) {
  return (card.oracle_text || card.card_faces?.map(f => f.oracle_text).join('\n') || '').toLowerCase();
}
function hasText(c, s) { return oracleText(c).includes(s); }
function scryfallUrl(name) { return `https://scryfall.com/search?q=%21%22${encodeURIComponent(name)}%22`; }
function imgUri(card) {
  if (card.image_uris?.normal) return card.image_uris.normal;
  if (card.card_faces) for (const f of card.card_faces) if (f.image_uris?.normal) return f.image_uris.normal;
  return null;
}
function scryfallId(colors) { return [...colors].map(c => c.toLowerCase()).join(''); }
function identityName(colors) {
  const sorted = COLOR_ORDER.filter(c => colors.includes(c));
  const match = PRESETS.find(p =>
    p.colors.length === sorted.length && sorted.every(c => p.colors.includes(c))
  );
  return match ? match.name : sorted.join('');
}

async function fetchAll(query) {
  let cards = [], url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(query)}&order=name`;
  while (url) {
    const d = await (await fetch(url)).json();
    if (d.object === 'error') {
      if (d.code === 'not_found') return [];
      throw new Error(d.details || 'Scryfall error');
    }
    cards = cards.concat(d.data);
    url = d.has_more ? d.next_page : null;
  }
  return cards;
}

// ── Pairing helpers (used by startSearch) ────────────────────────────────────

function addPair(anchor, partner, type, tagClass, tagLabel) {
  const key = anchor.id;
  if (!groupMap.has(key)) groupMap.set(key, { anchor, partners: [], type, tagClass, tagLabel });
  if (!groupMap.get(key).partners.find(p => p.id === partner.id))
    groupMap.get(key).partners.push(partner);
}

function pairSameGroup(group, type, tagClass, tagLabel) {
  for (let i = 0; i < group.length; i++)
    for (let j = 0; j < group.length; j++) {
      if (i === j) continue;
      const a = group[i], b = group[j];
      if (isExactTarget(unionId(colorId(a), colorId(b))))
        addPair(a, b, type, tagClass, tagLabel);
    }
}

// ── State ─────────────────────────────────────────────────────────────────────

let TARGET = new Set();
let groupMap = new Map();
let soloCards = [];
let partnerIndex = new Map();
let activeGroupId = null;

// ── Search ────────────────────────────────────────────────────────────────────

function goBack() {
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('identity-screen').style.display = 'flex';
  groupMap = new Map();
  soloCards = [];
  partnerIndex = new Map();
  activeGroupId = null;
  document.getElementById('output').innerHTML = '';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('filter-search').value = '';
  document.getElementById('filter-type').value = 'all';
}

async function startSearch() {
  const selectedUpper = getSelectedColors();
  if (!selectedUpper.length) return;

  TARGET = new Set(selectedUpper.map(c => c.toLowerCase()));
  groupMap = new Map();
  soloCards = [];
  partnerIndex = new Map();
  activeGroupId = null;

  const name = identityName(selectedUpper);
  document.getElementById('results-title').textContent = `${name} Commander Finder`;
  document.getElementById('results-subtitle').textContent =
    `Every legal pairing resolving to exactly ${name} identity — click a row, then ↑ ↓ to cycle partners`;

  const manaHtml = COLOR_ORDER.filter(c => selectedUpper.includes(c)).map(c => {
    const d = COLOR_DATA[c];
    return `<div class="mpip" style="background:${d.bg};color:${d.fg};border-color:rgba(255,255,255,0.22)">${c}</div>`;
  }).join('');
  document.getElementById('mana-display').innerHTML = manaHtml;

  const accents = COLOR_ORDER.filter(c => selectedUpper.includes(c));
  if (accents[0]) document.documentElement.style.setProperty('--accent1-rgb', COLOR_DATA[accents[0]].rgb);
  if (accents[1]) document.documentElement.style.setProperty('--accent2-rgb', COLOR_DATA[accents[1]].rgb);

  document.getElementById('identity-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';
  document.getElementById('status-bar').style.display = 'flex';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('output').innerHTML = '';
  document.getElementById('error-container').innerHTML = '';

  const sid = scryfallId(selectedUpper);

  try {
    const setStatus = t => document.getElementById('status-text').textContent = t;

    setStatus(`Fetching solo ${name} commanders…`);
    soloCards = await fetchAll(`is:commander legal:commander id=${sid}`);

    setStatus('Fetching partnerable commanders…');
    const partnerables = await fetchAll(`is:commander legal:commander id<=${sid} is:partner`);

    setStatus('Fetching Backgrounds…');
    const backgrounds = await fetchAll(`t:background legal:commander id<=${sid}`);

    setStatus('Fetching Time Lord Doctors…');
    const doctors = await fetchAll(`is:commander legal:commander t:"time lord" t:doctor`);

    setStatus('Computing pairings…');

    // Bucket every card into its mechanic type using the registry's detect functions
    const buckets = {};
    for (const pt of PARTNER_TYPES) {
      buckets[pt.key] = partnerables.filter(c => pt.detect(oracleText(c)));
    }

    // Pair each bucket according to its pairing rule
    for (const pt of PARTNER_TYPES) {
      const group = buckets[pt.key];
      const tagClass = `tag-${pt.key}`;

      if (pt.pairingRule === 'sameGroup') {
        pairSameGroup(group, pt.key, tagClass, pt.label);

      } else if (pt.pairingRule === 'partnerWith') {
        const pwSeen = new Set();
        for (const card of group) {
          const match = oracleText(card).match(/partner with ([^\n(]+)/i);
          if (!match) continue;
          const pName = match[1].trim().replace(/\s+/g, ' ');
          const partner = partnerables.find(c => c.name.toLowerCase() === pName.toLowerCase());
          if (!partner) continue;
          const key = [card.id, partner.id].sort().join('||');
          if (pwSeen.has(key)) continue;
          pwSeen.add(key);
          if (isExactTarget(unionId(colorId(card), colorId(partner)))) {
            addPair(card, partner, pt.key, tagClass, pt.label);
            addPair(partner, card, pt.key, tagClass, pt.label);
          }
        }

      } else if (pt.pairingRule === 'background') {
        for (const cmd of group)
          for (const bg of backgrounds)
            if (isExactTarget(unionId(colorId(cmd), colorId(bg))))
              addPair(cmd, bg, pt.key, tagClass, pt.label);

      } else if (pt.pairingRule === 'doctor') {
        for (const comp of group)
          for (const doc of doctors)
            if (isSubsetOfTarget(colorId(doc)) && isExactTarget(unionId(colorId(comp), colorId(doc))))
              addPair(comp, doc, pt.key, tagClass, pt.label);
      }
    }

    document.getElementById('spinner').style.display = 'none';
    const totalPairs = [...groupMap.values()].reduce((s, g) => s + g.partners.length, 0);
    setStatus(`Done — ${groupMap.size} anchor cards, ${totalPairs} pairings, ${soloCards.length} solo commanders.`);
    document.getElementById('controls').style.display = 'flex';
    renderAll();

  } catch(err) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status-text').textContent = 'Error fetching data.';
    document.getElementById('error-container').innerHTML = `<div class="error-msg">⚠ ${err.message}</div>`;
    console.error(err);
  }
}

// ── New mechanic scanner ──────────────────────────────────────────────────────
//
// Asks Scryfall for every card with "partner—" in its oracle text, extracts
// all unique subtypes, and compares them against the namedSubtype entries in
// PARTNER_TYPES. Any subtype not in the registry is reported as unknown.

async function scanForNewMechanics() {
  const cards = await fetchAll('o:"partner—"');
  const found = new Set();
  for (const card of cards) {
    for (const m of oracleText(card).matchAll(/partner—([^\n(,]+)/g))
      found.add(m[1].trim());
  }
  const known = new Set(PARTNER_TYPES.filter(pt => pt.namedSubtype).map(pt => pt.namedSubtype));
  return {
    found: [...found].sort(),
    unknown: [...found].filter(s => !known.has(s)).sort(),
  };
}

async function runMechanicScan() {
  const btn = document.querySelector('.scan-btn');
  const result = document.getElementById('scan-result');
  btn.disabled = true;
  btn.textContent = 'Scanning Scryfall…';
  result.innerHTML = '';
  try {
    const { found, unknown } = await scanForNewMechanics();
    if (unknown.length === 0) {
      result.innerHTML = `<span class="scan-ok">✓ All ${found.length} known partner subtypes are registered. Nothing new found.</span>`;
    } else {
      result.innerHTML = `<span class="scan-warn">⚠ ${unknown.length} unknown subtype${unknown.length !== 1 ? 's' : ''} found on Scryfall:<br>
        ${unknown.map(s => `<strong>partner—${s}</strong>`).join(', ')}<br>
        <small>Add these to PARTNER_TYPES in index.html to support them.</small></span>`;
    }
  } catch(e) {
    result.innerHTML = `<span class="scan-warn">Scan error: ${e.message}</span>`;
  }
  btn.disabled = false;
  btn.textContent = 'Scan Scryfall for unknown partner mechanics';
}

// ── Render ────────────────────────────────────────────────────────────────────

function getIndex(id) { return partnerIndex.get(id) || 0; }
function setIndex(id, i) { partnerIndex.set(id, i); }

function pipHtml(idSet) {
  return '<div class="identity-pips">' +
    COLOR_ORDER.map(c => c.toLowerCase()).filter(c => idSet.has(c)).map(c => {
      const d = COLOR_DATA[c.toUpperCase()];
      return `<span class="ipip" style="background:${d.bg};color:${d.fg}">${c.toUpperCase()}</span>`;
    }).join('') + '</div>';
}

function combinedPipHtml(idSet) {
  return COLOR_ORDER.map(c => c.toLowerCase()).filter(c => idSet.has(c)).map(c => {
    const d = COLOR_DATA[c.toUpperCase()];
    return `<span class="cpip" style="background:${d.bg};color:${d.fg}">${c.toUpperCase()}</span>`;
  }).join('');
}

function cardBlockHtml(card, width) {
  const img = imgUri(card);
  return `<div class="card-block">
    ${img
      ? `<img src="${img}" alt="${card.name}" width="${width}" loading="lazy">`
      : `<div class="img-placeholder" style="width:${width}px">No image</div>`}
    <a class="scryfall-btn" href="${scryfallUrl(card.name)}" target="_blank">Scryfall ↗</a>
  </div>`;
}

function partnerDisplayHtml(group, idx) {
  const partner = group.partners[idx];
  const combined = unionId(colorId(group.anchor), colorId(partner));
  const img = imgUri(partner);
  return `
    ${img
      ? `<div class="card-block"><img src="${img}" alt="${partner.name}" width="175" loading="lazy"></div>`
      : `<div class="card-block"><div class="img-placeholder" style="width:175px">No image</div></div>`}
    <div class="partner-info">
      <div class="pname">${partner.name}</div>
      <div class="ptype">${(partner.type_line||'').replace('Legendary Creature — ','').replace('Legendary Planeswalker — ','')}</div>
      <div class="pmechanic-row">
        <span class="mechanic-tag ${group.tagClass}">${group.tagLabel}</span>
        ${pipHtml(colorId(partner))}
      </div>
      <div class="combined-label">Combined identity:</div>
      <div class="combined-pips">${combinedPipHtml(combined)}</div>
      <a class="scryfall-btn" href="${scryfallUrl(partner.name)}" target="_blank" style="margin-top:0.4rem">View on Scryfall ↗</a>
    </div>`;
}

function groupDrawerInnerHtml(gid, group) {
  const idx = getIndex(gid);
  const total = group.partners.length;
  return `
    <div class="drawer-inner">
      <div class="panel-anchor">
        ${cardBlockHtml(group.anchor, 185)}
        <div class="card-label">${group.anchor.name}</div>
      </div>
      <div class="panel-partner">
        <div class="partner-nav">
          <button class="nav-btn" onclick="step(event,'${gid.replace(/'/g,"\\'")}', -1)" ${idx===0?'disabled':''} title="Previous (↑)">↑</button>
          <span class="nav-label"><strong>${idx+1}</strong> of <strong>${total}</strong> partner${total!==1?'s':''}</span>
          <button class="nav-btn" onclick="step(event,'${gid.replace(/'/g,"\\'")}', 1)" ${idx===total-1?'disabled':''} title="Next (↓)">↓</button>
          <span class="key-hint">↑ ↓ keys</span>
        </div>
        <div class="partner-display" id="pdisplay-${CSS.escape(gid)}">
          ${partnerDisplayHtml(group, idx)}
        </div>
      </div>
    </div>`;
}

function groupRowHtml(gid, group) {
  const idx = getIndex(gid);
  const total = group.partners.length;
  const isOpen = activeGroupId === gid;
  const preview = group.partners.slice(0,3).map(p=>`<em>${p.name}</em>`).join(', ')
                + (total > 3 ? `, +${total-3} more` : '');
  const escapedGid = gid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

  return `
    <div class="group-item${isOpen?' open':''}" id="group-${CSS.escape(gid)}"
         tabindex="0"
         onclick="toggleGroup(event,'${escapedGid}')"
         onkeydown="handleKey(event,'${escapedGid}')">
      <div class="group-header">
        <span class="anchor-name">${group.anchor.name}</span>
        <span class="partner-preview">${preview}</span>
        <div class="group-badges">
          <span class="partner-counter">${total} partner${total!==1?'s':''}</span>
          <span class="mechanic-tag ${group.tagClass}">${group.tagLabel}</span>
          ${pipHtml(colorId(group.anchor))}
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="group-drawer">${isOpen ? groupDrawerInnerHtml(gid, group) : ''}</div>
    </div>`;
}

function soloGroupHtml(card) {
  const gid = 'solo::' + card.id;
  const isOpen = activeGroupId === gid;
  const escapedGid = gid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `
    <div class="group-item${isOpen?' open':''}" id="group-${CSS.escape(gid)}"
         tabindex="0"
         onclick="toggleGroup(event,'${escapedGid}')"
         onkeydown="handleKey(event,'${escapedGid}')">
      <div class="group-header">
        <span class="anchor-name">${card.name}</span>
        <span class="partner-preview" style="color:rgba(245,240,232,0.3)">Solo — no partner needed</span>
        <div class="group-badges">
          <span class="mechanic-tag tag-solo">Solo</span>
          ${pipHtml(colorId(card))}
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="group-drawer">${isOpen ? `
        <div class="solo-drawer-inner">
          ${cardBlockHtml(card, 185)}
          <div class="partner-info">
            <div class="pname">${card.name}</div>
            <div class="ptype">${(card.type_line||'').replace('Legendary Creature — ','').replace('Legendary Planeswalker — ','')}</div>
            <div class="combined-label" style="margin-top:0.5rem">Color identity:</div>
            <div class="combined-pips">${combinedPipHtml(colorId(card))}</div>
            <a class="scryfall-btn" href="${scryfallUrl(card.name)}" target="_blank" style="margin-top:0.5rem">Scryfall ↗</a>
          </div>
        </div>` : ''}</div>
    </div>`;
}

function renderAll() {
  const typeFilter   = document.getElementById('filter-type').value;
  const searchFilter = document.getElementById('filter-search').value.toLowerCase().trim();

  const filteredGroups = [...groupMap.entries()].filter(([gid, group]) => {
    if (typeFilter !== 'all' && typeFilter !== 'solo' && group.type !== typeFilter) return false;
    if (typeFilter === 'solo') return false;
    if (searchFilter && !group.anchor.name.toLowerCase().includes(searchFilter) &&
        !group.partners.some(p => p.name.toLowerCase().includes(searchFilter))) return false;
    return true;
  });

  const filteredSolo = soloCards.filter(c => {
    if (typeFilter !== 'all' && typeFilter !== 'solo') return false;
    if (searchFilter && !c.name.toLowerCase().includes(searchFilter)) return false;
    return true;
  });

  const total = filteredGroups.length + filteredSolo.length;
  document.getElementById('count-badge').textContent = `${total} anchor${total!==1?'s':''}`;

  let html = '';

  for (const type of typeOrder) {
    if (typeFilter !== 'all' && typeFilter !== type) continue;
    const sec = filteredGroups.filter(([,g]) => g.type === type);
    if (!sec.length) continue;
    const meta = sectionMeta[type];
    html += `
      <div class="section">
        <div class="section-header">
          <span class="section-title">${meta.label}</span>
          <span class="section-count">${sec.length} anchor${sec.length!==1?'s':''}</span>
        </div>
        <div class="groups-list">
          ${sec.map(([gid, group]) => groupRowHtml(gid, group)).join('')}
        </div>
      </div>`;
  }

  if ((typeFilter === 'all' || typeFilter === 'solo') && filteredSolo.length) {
    html += `
      <div class="section">
        <div class="section-header">
          <span class="section-title">Solo Commanders</span>
          <span class="section-count">${filteredSolo.length} cards</span>
        </div>
        <div class="groups-list">
          ${filteredSolo.map(c => soloGroupHtml(c)).join('')}
        </div>
      </div>`;
  }

  document.getElementById('output').innerHTML = html || '<div class="empty-state">No results match your filters.</div>';
}

// ── Interaction ───────────────────────────────────────────────────────────────

function toggleGroup(event, gid) {
  if (event && (event.target.tagName === 'A' || event.target.tagName === 'BUTTON')) return;
  const el = document.getElementById('group-' + CSS.escape(gid));
  if (!el) return;
  const wasOpen = el.classList.contains('open');

  if (wasOpen) {
    activeGroupId = null;
    el.classList.remove('open');
    el.querySelector('.group-drawer').innerHTML = '';
  } else {
    if (activeGroupId) {
      const prev = document.getElementById('group-' + CSS.escape(activeGroupId));
      if (prev) { prev.classList.remove('open'); prev.querySelector('.group-drawer').innerHTML = ''; }
    }
    activeGroupId = gid;
    el.classList.add('open');
    const drawer = el.querySelector('.group-drawer');
    const group = groupMap.get(gid);
    if (group) {
      drawer.innerHTML = groupDrawerInnerHtml(gid, group);
    } else {
      const card = soloCards.find(c => 'solo::' + c.id === gid);
      if (card) drawer.innerHTML = `
        <div class="solo-drawer-inner">
          ${cardBlockHtml(card, 185)}
          <div class="partner-info">
            <div class="pname">${card.name}</div>
            <div class="ptype">${(card.type_line||'').replace('Legendary Creature — ','').replace('Legendary Planeswalker — ','')}</div>
            <div class="combined-label" style="margin-top:0.5rem">Color identity:</div>
            <div class="combined-pips">${combinedPipHtml(colorId(card))}</div>
            <a class="scryfall-btn" href="${scryfallUrl(card.name)}" target="_blank" style="margin-top:0.5rem">Scryfall ↗</a>
          </div>
        </div>`;
    }
    el.focus({ preventScroll: true });
  }
}

function step(event, gid, dir) {
  event.stopPropagation();
  const group = groupMap.get(gid);
  if (!group) return;
  const cur = getIndex(gid);
  const next = Math.max(0, Math.min(group.partners.length - 1, cur + dir));
  if (next === cur) return;
  setIndex(gid, next);

  const el = document.getElementById('group-' + CSS.escape(gid));
  if (!el) return;

  const btns = el.querySelectorAll('.nav-btn');
  if (btns[0]) btns[0].disabled = (next === 0);
  if (btns[1]) btns[1].disabled = (next === group.partners.length - 1);

  const label = el.querySelector('.nav-label');
  if (label) label.innerHTML = `<strong>${next+1}</strong> of <strong>${group.partners.length}</strong> partner${group.partners.length!==1?'s':''}`;

  const display = el.querySelector('.partner-display');
  if (display) {
    display.style.opacity = '0';
    setTimeout(() => {
      display.innerHTML = partnerDisplayHtml(group, next);
      display.style.opacity = '1';
    }, 110);
  }
}

function handleKey(event, gid) {
  const el = document.getElementById('group-' + CSS.escape(gid));
  if (!el) return;
  const isOpen = el.classList.contains('open');

  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault(); toggleGroup(event, gid);
  } else if (isOpen && event.key === 'ArrowDown') {
    event.preventDefault(); step(event, gid, 1);
  } else if (isOpen && event.key === 'ArrowUp') {
    event.preventDefault(); step(event, gid, -1);
  } else if (isOpen && event.key === 'Escape') {
    event.preventDefault(); toggleGroup(event, gid);
  }
}
</script>
