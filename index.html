<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commander Partner Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --dark: #0d0d0d;
    --surface: #111820;
    --surface2: #1a2433;
    --surface3: #0c1219;
    --white: #f5f0e8;
    --border: rgba(201,168,76,0.22);
    --border-hover: rgba(201,168,76,0.55);
    --accent1: #8b1a1a;
    --accent2: #1a3a5c;
    --accent3: #2a6a3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 18px; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 15% 15%, rgba(var(--accent1-rgb), 0.13) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(var(--accent2-rgb), 0.16) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.04) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
    transition: background 0.6s;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 1500px;
    margin: 0 auto;
    padding: 2rem 2rem 5rem;
  }

  /* ── Identity picker ── */
  #identity-screen {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2.5rem;
    padding: 3rem 1.5rem;
  }

  #identity-screen h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: var(--gold);
    text-shadow: 0 0 50px rgba(201,168,76,0.3);
    letter-spacing: 0.04em;
    text-align: center;
  }

  #identity-screen p {
    color: rgba(245,240,232,0.45);
    font-style: italic;
    font-size: 1.1rem;
    text-align: center;
    max-width: 520px;
  }

  .color-picker {
    display: flex; gap: 1.4rem; flex-wrap: wrap; justify-content: center;
  }

  .color-toggle {
    display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
    cursor: pointer; user-select: none;
  }

  .color-toggle input { display: none; }

  .color-pip-btn {
    width: 66px; height: 66px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.55rem;
    border: 3px solid rgba(255,255,255,0.15);
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, opacity 0.15s;
    opacity: 0.38;
  }

  .color-toggle input:checked + .color-pip-btn {
    opacity: 1;
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 20px rgba(255,255,255,0.15);
    transform: scale(1.08);
  }

  .color-toggle:hover .color-pip-btn { opacity: 0.7; transform: scale(1.04); }
  .color-toggle input:checked + .color-pip-btn:hover { opacity: 1; transform: scale(1.12); }

  .pip-W { background: #e8e4cc; color: #2a2200; }
  .pip-U { background: #1a5a9c; color: #fff; }
  .pip-B { background: #1a1020; color: #c8a0e8; border-color: rgba(200,160,232,0.3) !important; }
  .pip-R { background: #9c1a1a; color: #fff; }
  .pip-G { background: #1a6a2a; color: #fff; }
  .pip-C { background: #7a7a7a; color: #f0ede8; border-color: rgba(200,195,185,0.3) !important; }

  .pip-divider {
    width: 1px; height: 66px; align-self: center;
    background: rgba(201,168,76,0.18);
    flex-shrink: 0;
  }

  .color-label { font-size: 0.84rem; color: rgba(245,240,232,0.45); letter-spacing: 0.06em; }

  .preset-row {
    display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
    max-width: 700px;
  }

  .preset-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: rgba(245,240,232,0.65);
    font-family: 'Crimson Pro', serif;
    font-size: 0.92rem;
    padding: 0.35rem 1rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .preset-btn:hover { border-color: var(--border-hover); color: var(--gold); background: var(--surface2); }

  #go-btn {
    background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.08));
    border: 1px solid rgba(201,168,76,0.5);
    border-radius: 8px;
    color: var(--gold);
    font-family: 'Cinzel Decorative', serif;
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    padding: 0.85rem 2.8rem;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  #go-btn:hover {
    background: linear-gradient(135deg, rgba(201,168,76,0.28), rgba(201,168,76,0.14));
    box-shadow: 0 0 24px rgba(201,168,76,0.2);
    transform: scale(1.03);
  }
  #go-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

  .identity-preview {
    display: flex; gap: 0.5rem; align-items: center; min-height: 32px;
  }

  /* Mechanic scanner */
  #scan-area { text-align: center; }
  .scan-btn {
    background: none; border: none;
    color: rgba(245,240,232,0.28);
    font-family: 'Crimson Pro', serif; font-size: 0.88rem; font-style: italic;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    transition: color 0.15s;
  }
  .scan-btn:hover { color: rgba(245,240,232,0.55); }
  .scan-btn:disabled { cursor: default; text-decoration: none; }
  #scan-result { margin-top: 0.55rem; font-size: 0.88rem; line-height: 1.6; }
  .scan-ok   { color: rgba(122,208,154,0.65); }
  .scan-warn { color: #e0b06a; }

  /* ── Results screen ── */
  #results-screen { display: none; }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .mana-display {
    display: flex; justify-content: center; gap: 0.55rem; margin-bottom: 0.9rem; flex-wrap: wrap;
  }

  .mpip {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.1rem;
    border: 2px solid rgba(255,255,255,0.25);
    transition: transform 0.3s;
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.28);
    letter-spacing: 0.04em; line-height: 1.2; margin-bottom: 0.35rem;
  }

  .subtitle { color: rgba(245,240,232,0.42); font-style: italic; font-size: 1rem; }

  .back-btn {
    position: absolute; top: 0; left: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: rgba(245,240,232,0.5);
    font-family: 'Crimson Pro', serif; font-size: 0.9rem;
    padding: 0.4rem 0.95rem; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-btn:hover { color: var(--gold); border-color: var(--border-hover); }

  #status-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.9rem 1.3rem; margin-bottom: 1.75rem;
    font-size: 0.95rem; color: var(--gold-light);
    display: flex; align-items: center; gap: 0.7rem;
  }
  .spinner {
    width: 15px; height: 15px; flex-shrink: 0;
    border: 2px solid rgba(201,168,76,0.22);
    border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls {
    display: flex; flex-wrap: wrap; gap: 0.65rem;
    margin-bottom: 1.75rem; align-items: center;
  }
  .filter-group {
    display: flex; align-items: center; gap: 0.42rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.4rem 0.8rem; font-size: 0.92rem;
  }
  .filter-group label { color: rgba(245,240,232,0.52); white-space: nowrap; }
  select, input[type="text"] {
    background: transparent; border: none; color: var(--white);
    font-family: 'Crimson Pro', serif; font-size: 0.97rem;
    outline: none; cursor: pointer;
  }
  select option { background: var(--surface2); }
  input[type="text"] { width: 175px; padding: 0.08rem 0; border-bottom: 1px solid var(--border); }
  .count-badge {
    margin-left: auto; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 0.3rem 1rem; font-size: 0.87rem; color: var(--gold); white-space: nowrap;
  }

  /* View toggle */
  .view-toggle { padding: 0.25rem 0.35rem; gap: 0.2rem; }
  .vt-btn {
    background: transparent; border: none;
    color: rgba(245,240,232,0.42);
    font-family: 'Crimson Pro', serif; font-size: 0.9rem;
    padding: 0.22rem 0.7rem; cursor: pointer; border-radius: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .vt-btn.active { background: var(--surface3); color: var(--gold); }
  .vt-btn:hover:not(.active) { color: rgba(245,240,232,0.72); }

  .section { margin-bottom: 2.75rem; }
  .section-header {
    display: flex; align-items: baseline; gap: 1rem;
    margin-bottom: 1.05rem; padding-bottom: 0.42rem;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.98rem; color: var(--gold); letter-spacing: 0.05em;
  }
  .section-count { font-size: 0.87rem; color: rgba(245,240,232,0.35); font-style: italic; }

  /* ── Row view ── */
  .groups-list { display: flex; flex-direction: column; gap: 0.5rem; }

  .group-item {
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    transition: border-color 0.2s; outline: none;
  }
  .group-item:focus, .group-item.focused { border-color: var(--border-hover); box-shadow: 0 0 0 2px rgba(201,168,76,0.16); }
  .group-item.open { border-color: var(--border-hover); }

  .group-header {
    background: var(--surface); padding: 0.82rem 1.2rem;
    display: flex; align-items: center; gap: 0.85rem;
    cursor: pointer; user-select: none; transition: background 0.15s;
  }
  .group-header:hover { background: var(--surface2); }

  .anchor-name { font-size: 1.02rem; font-weight: 600; color: var(--white); flex-shrink: 0; }

  .partner-preview {
    flex: 1; font-size: 0.9rem; color: rgba(245,240,232,0.46);
    font-style: italic; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .partner-preview em { color: rgba(245,240,232,0.72); font-style: normal; }

  .group-badges { display: flex; align-items: center; gap: 0.42rem; flex-shrink: 0; }

  .partner-counter {
    font-size: 0.8rem; color: rgba(201,168,76,0.62);
    background: rgba(201,168,76,0.07); border: 1px solid rgba(201,168,76,0.18);
    border-radius: 20px; padding: 0.14rem 0.6rem; white-space: nowrap;
  }

  .mechanic-tag {
    font-size: 0.7rem; padding: 0.16rem 0.5rem;
    border-radius: 3px; font-family: 'Crimson Pro', serif;
    letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; white-space: nowrap;
  }

  .tag-solo     { background: rgba(80,70,10,0.6);  color: #d4c45a; border: 1px solid rgba(212,196,90,0.3); }
  .tag-variable { background: rgba(40,10,70,0.6);  color: #c49ae0; border: 1px solid rgba(196,154,224,0.3); }

  .identity-pips { display: flex; gap: 3px; }
  .ipip {
    width: 15px; height: 15px; border-radius: 50%; font-size: 0.55rem;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; border: 1px solid rgba(255,255,255,0.16);
  }

  .chevron {
    color: rgba(201,168,76,0.42); font-size: 0.8rem;
    transition: transform 0.2s, color 0.2s; flex-shrink: 0;
  }
  .group-item.open .chevron { transform: rotate(180deg); color: var(--gold); }

  .group-drawer {
    display: none; background: var(--surface3); border-top: 1px solid var(--border);
  }
  .group-item.open .group-drawer { display: block; }

  /* ── Card grid view ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
    gap: 1.1rem;
  }

  .card-grid-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    display: flex; flex-direction: column; align-items: center;
    padding: 0.8rem 0.8rem 0.7rem;
    gap: 0.52rem;
  }
  .card-grid-item:hover {
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .card-grid-item img {
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.55);
    width: 100%;
    display: block;
    cursor: zoom-in;
  }
  .card-grid-item .grid-name {
    font-size: 0.85rem; font-weight: 600; color: var(--white);
    text-align: center; line-height: 1.3;
  }
  .card-grid-item .grid-badges {
    display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .card-grid-placeholder {
    width: 100%; aspect-ratio: 488/680;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(245,240,232,0.26); font-size: 0.8rem; font-style: italic;
  }

  /* ── Drawer inner (shared by row drawer and group modal) ── */
  .drawer-inner { display: flex; align-items: stretch; min-height: 360px; }

  .panel-anchor {
    flex: 0 0 240px; padding: 1.4rem 1.1rem 1.4rem 1.5rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
    border-right: 1px solid var(--border);
  }

  .panel-partner { flex: 1; display: flex; flex-direction: column; }

  .partner-nav {
    display: flex; align-items: center; padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border); gap: 0.55rem;
    background: rgba(0,0,0,0.14);
  }

  .nav-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; color: var(--gold);
    font-size: 0.9rem; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.14s, border-color 0.14s;
    flex-shrink: 0; user-select: none;
  }
  .nav-btn:hover { background: var(--surface2); border-color: var(--border-hover); }
  .nav-btn:disabled { opacity: 0.22; cursor: default; }

  .nav-label { font-size: 0.87rem; color: rgba(245,240,232,0.47); flex: 1; text-align: center; }
  .nav-label strong { color: var(--gold-light); }
  .key-hint { font-size: 0.72rem; color: rgba(245,240,232,0.25); flex-shrink: 0; font-style: italic; }

  .partner-display {
    flex: 1; padding: 1.2rem 1.4rem;
    display: flex; align-items: flex-start; gap: 1.2rem; flex-wrap: wrap;
    transition: opacity 0.12s;
  }

  .card-block { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .card-block img {
    border-radius: 10px; box-shadow: 0 6px 22px rgba(0,0,0,0.62);
    display: block;
    cursor: zoom-in;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .card-block img:hover { transform: scale(1.035); box-shadow: 0 11px 36px rgba(0,0,0,0.78); }

  .card-label { font-size: 0.84rem; color: rgba(245,240,232,0.48); font-style: italic; text-align: center; max-width: 195px; }

  .scryfall-btn {
    display: inline-block; font-size: 0.75rem;
    color: rgba(201,168,76,0.52); text-decoration: none;
    border: 1px solid rgba(201,168,76,0.2); border-radius: 4px; padding: 0.18rem 0.52rem;
    transition: color 0.18s, border-color 0.18s;
  }
  .scryfall-btn:hover { color: var(--gold); border-color: var(--gold); }

  .img-placeholder {
    width: 195px; height: 272px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(245,240,232,0.26); font-size: 0.8rem; font-style: italic;
  }

  .partner-info {
    flex: 1; min-width: 140px; padding-top: 0.2rem;
    display: flex; flex-direction: column; gap: 0.56rem;
  }
  .partner-info .pname { font-size: 1.08rem; font-weight: 600; color: var(--white); line-height: 1.3; }
  .partner-info .ptype { font-size: 0.85rem; color: rgba(245,240,232,0.4); font-style: italic; }
  .partner-info .pmechanic-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .partner-info .combined-label { font-size: 0.8rem; color: rgba(245,240,232,0.36); margin-top: 0.18rem; }
  .partner-info .combined-pips { display: flex; gap: 4px; margin-top: 0.08rem; }

  .declared-note {
    display: flex; align-items: center; gap: 0.38rem; flex-wrap: wrap;
    font-size: 0.8rem; color: rgba(196,154,224,0.8);
    background: rgba(40,10,70,0.28); border: 1px solid rgba(196,154,224,0.2);
    border-radius: 4px; padding: 0.3rem 0.6rem; margin-top: 0.1rem;
  }

  .cpip {
    width: 18px; height: 18px; border-radius: 50%; font-size: 0.64rem;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; border: 1px solid rgba(255,255,255,0.18);
  }

  .solo-drawer-inner {
    display: flex; align-items: flex-start; padding: 1.5rem; gap: 1.5rem; flex-wrap: wrap;
  }

  .error-msg {
    color: #e07a7a; background: rgba(139,26,26,0.16);
    border: 1px solid rgba(139,26,26,0.32); border-radius: 6px;
    padding: 0.9rem 1.3rem; margin-bottom: 1.4rem;
  }
  .empty-state {
    text-align: center; color: rgba(245,240,232,0.28);
    font-style: italic; padding: 2.5rem;
  }

  /* ── Group modal (card view) ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.88);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .modal-overlay.hidden { display: none; }
  .modal-inner {
    background: var(--surface3);
    border: 1px solid var(--border-hover);
    border-radius: 14px;
    overflow: hidden;
    max-width: 820px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    position: relative;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.8rem 1.1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .modal-title { font-family: 'Cinzel Decorative', serif; font-size: 0.85rem; color: var(--gold); }
  .modal-close-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(245,240,232,0.55); cursor: pointer; font-size: 1rem;
    transition: color 0.15s, border-color 0.15s;
  }
  .modal-close-btn:hover { color: var(--gold); border-color: var(--border-hover); }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.94);
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.hidden { display: none; }
  .lightbox img {
    max-width: min(88vw, 488px);
    max-height: 92vh;
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.85);
    cursor: zoom-out;
  }
  .lightbox-close {
    position: fixed; top: 1.2rem; right: 1.5rem;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 50%; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(245,240,232,0.7); cursor: pointer; font-size: 1.1rem;
    transition: color 0.15s, border-color 0.15s;
    z-index: 201;
  }
  .lightbox-close:hover { color: var(--gold); border-color: var(--border-hover); }
</style>
</head>
<body>

<!-- ── Lightbox overlay ── -->
<div class="lightbox hidden" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()" title="Close (Esc)">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- ── Group modal (card view) ── -->
<div class="modal-overlay hidden" id="group-modal" onclick="onModalOverlayClick(event)">
  <div class="modal-inner" id="group-modal-inner">
    <div class="modal-header">
      <span class="modal-title" id="group-modal-title"></span>
      <button class="modal-close-btn" onclick="closeGroupModal()" title="Close (Esc)">✕</button>
    </div>

// ── Color picker ──────────────────────────────────────────────────────────────

function getSelectedColors() {
  return [...document.querySelectorAll('.color-picker input:checked')].map(i => i.value);
}

function setColors(colors) {
  document.querySelectorAll('.color-picker input').forEach(i => {
    i.checked = colors.includes(i.value);
  });
  onColorChange(colors[0] || null);
}

function onColorChange(changedValue) {
  if (changedValue === 'C') {
    document.querySelectorAll('.color-picker input:not([value="C"])').forEach(i => i.checked = false);
  } else if (changedValue) {
    const cInput = document.querySelector('.color-picker input[value="C"]');
    if (cInput) cInput.checked = false;
  }
  const sel = getSelectedColors();
  updateIdentityPreview(sel);
  document.getElementById('go-btn').disabled = sel.length === 0;
}

function updateIdentityPreview(colors) {
  const el = document.getElementById('identity-preview');
  if (!colors.length) { el.innerHTML = ''; return; }
  if (colors.includes('C')) {
    const d = COLOR_DATA['C'];
    el.innerHTML = `<div style="width:32px;height:32px;border-radius:50%;background:${d.bg};color:${d.fg};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;border:2px solid rgba(255,255,255,0.25)">C</div>`;
    return;
  }
  el.innerHTML = COLOR_ORDER.filter(c => colors.includes(c)).map(c => {
    const d = COLOR_DATA[c];
    return `<div style="width:32px;height:32px;border-radius:50%;background:${d.bg};color:${d.fg};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;border:2px solid rgba(255,255,255,0.25)">${c}</div>`;
  }).join('');
}

// ── State ─────────────────────────────────────────────────────────────────────

let TARGET = new Set();
let groupMap = new Map();
let soloCards = [];
let partnerIndex = new Map();
let activeGroupId = null;
let viewMode = 'row';

// ── Utility functions ─────────────────────────────────────────────────────────

function isExactTarget(s) {
  if (s.size !== TARGET.size) return false;
  for (const c of s) if (!TARGET.has(c)) return false;
  return true;
}
function unionId(a, b) { return new Set([...a, ...b]); }
function colorId(card) { return new Set((card.color_identity || []).map(c => c.toLowerCase())); }
function oracleText(card) {
  return (card.oracle_text || card.card_faces?.map(f => f.oracle_text).join('\n') || '').toLowerCase();
}
function scryfallUrl(name) { return `https://scryfall.com/search?q=%21%22${encodeURIComponent(name)}%22`; }
function imgUri(card) {
  if (card.image_uris?.normal) return card.image_uris.normal;
  if (card.card_faces) for (const f of card.card_faces) if (f.image_uris?.normal) return f.image_uris.normal;
  return null;
}
function imgUriLarge(card) {
  if (card.image_uris?.large) return card.image_uris.large;
  if (card.image_uris?.normal) return card.image_uris.normal;
  if (card.card_faces) for (const f of card.card_faces) {
    if (f.image_uris?.large) return f.image_uris.large;
    if (f.image_uris?.normal) return f.image_uris.normal;
  }
  return null;
}
function scryfallId(colors) {
  if (colors.includes('C') || colors.length === 0) return 'c';
  return [...colors].map(c => c.toLowerCase()).join('');
}
function identityName(colors) {
  if (colors.includes('C') || colors.length === 0) return 'Colorless';
  const sorted = COLOR_ORDER.filter(c => colors.includes(c));
  const match = PRESETS.find(p =>
    p.colors.length === sorted.length && sorted.every(c => p.colors.includes(c))
  );
  return match ? match.name : sorted.join('');
}

async function fetchAll(query) {
  let cards = [], url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(query)}&order=name`;
  while (url) {
    const d = await (await fetch(url)).json();
    if (d.object === 'error') {
      if (d.code === 'not_found') return [];
      throw new Error(d.details || 'Scryfall error');
    }
    cards = cards.concat(d.data);
    url = d.has_more ? d.next_page : null;
  }
  return cards;
}

// ── Pairing helpers ───────────────────────────────────────────────────────────

function addPair(anchor, partner, type, tagClass, tagLabel) {
  const key = anchor.id;
  if (!groupMap.has(key)) groupMap.set(key, { anchor, partners: [], type, tagClass, tagLabel });
  if (!groupMap.get(key).partners.find(p => p.name === partner.name))
    groupMap.get(key).partners.push(partner);
}

function pairSameGroup(group, type, tagClass, tagLabel) {
  for (let i = 0; i < group.length; i++) {
    const a = group[i];
    for (let j = 0; j < group.length; j++) {
      if (i === j || a.name === group[j].name) continue;
      const b = group[j];
      if (isExactTarget(unionId(colorId(a), colorId(b))))
        addPair(a, b, type, tagClass, tagLabel);
    }
  }
}

// ── Navigation ────────────────────────────────────────────────────────────────

function goBack() {
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('identity-screen').style.display = 'flex';
  groupMap = new Map();
  soloCards = [];
  partnerIndex = new Map();
  activeGroupId = null;

function setViewMode(mode) {

  document.getElementById('vt-card').classList.toggle('active', mode === 'card');
  renderAll();
}

// ── Search ────────────────────────────────────────────────────────────────────

async function startSearch() {
  const selectedUpper = getSelectedColors();
  if (!selectedUpper.length) return;

  const isColorless = selectedUpper.includes('C');
  TARGET = isColorless ? new Set() : new Set(selectedUpper.map(c => c.toLowerCase()));

  groupMap = new Map();
  soloCards = [];
  partnerIndex = new Map();
  activeGroupId = null;

  const name = identityName(selectedUpper);
  document.getElementById('results-title').textContent = `${name} Commander Finder`;
  document.getElementById('results-subtitle').textContent =
    `Every legal pairing resolving to exactly ${name} identity — click a row, then ↑ ↓ to cycle partners`;

  let manaHtml;
  if (isColorless) {
    const d = COLOR_DATA['C'];
    manaHtml = `<div class="mpip" style="background:${d.bg};color:${d.fg};border-color:rgba(255,255,255,0.22)">C</div>`;
  } else {
    manaHtml = COLOR_ORDER.filter(c => selectedUpper.includes(c)).map(c => {
      const d = COLOR_DATA[c];
      return `<div class="mpip" style="background:${d.bg};color:${d.fg};border-color:rgba(255,255,255,0.22)">${c}</div>`;
    }).join('');
  }
  document.getElementById('mana-display').innerHTML = manaHtml;

  const accents = isColorless ? ['C'] : COLOR_ORDER.filter(c => selectedUpper.includes(c));
  if (accents[0]) document.documentElement.style.setProperty('--accent1-rgb', COLOR_DATA[accents[0]].rgb);
  if (accents[1]) document.documentElement.style.setProperty('--accent2-rgb', COLOR_DATA[accents[1]].rgb);

  document.getElementById('identity-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';
  document.getElementById('status-bar').style.display = 'flex';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('output').innerHTML = '';
  document.getElementById('error-container').innerHTML = '';

  const sid = scryfallId(selectedUpper);

  try {
    const setStatus = t => document.getElementById('status-text').textContent = t;

    setStatus(`Fetching solo ${name} commanders…`);
    soloCards = await fetchAll(`is:commander legal:commander id=${sid}`);

    setStatus('Fetching partnerable commanders…');
    const partnerables = await fetchAll(`is:commander legal:commander id<=${sid} is:partner`);

    setStatus('Fetching Backgrounds…');
    const backgrounds = await fetchAll(`t:background legal:commander id<=${sid}`);

    setStatus('Fetching Time Lord Doctors…');
    const doctors = await fetchAll(`is:commander legal:commander t:"time lord" t:doctor`);

    setStatus('Computing pairings…');

    const buckets = {};
    for (const pt of PARTNER_TYPES) {
      buckets[pt.key] = partnerables.filter(c => pt.detect(oracleText(c)));
    }

    for (const pt of PARTNER_TYPES) {
      const group = buckets[pt.key];
      const tagClass = `tag-${pt.key}`;

      if (pt.pairingRule === 'sameGroup') {
        pairSameGroup(group, pt.key, tagClass, pt.label);

      } else if (pt.pairingRule === 'partnerWith') {
        const pwSeen = new Set();
        for (const card of group) {
          const match = oracleText(card).match(/partner with ([^\n(]+)/i);
          if (!match) continue;
          const pName = match[1].trim().replace(/\s+/g, ' ');
          const partner = partnerables.find(c => c.name.toLowerCase() === pName.toLowerCase());
          if (!partner) continue;
          const key = [card.id, partner.id].sort().join('||');
          if (pwSeen.has(key)) continue;
          pwSeen.add(key);
          if (isExactTarget(unionId(colorId(card), colorId(partner)))) {
            addPair(card, partner, pt.key, tagClass, pt.label);
            addPair(partner, card, pt.key, tagClass, pt.label);
          }
        }

      } else if (pt.pairingRule === 'background') {
        for (const cmd of group) {
          for (const bg of backgrounds) {
            if (isExactTarget(unionId(colorId(cmd), colorId(bg))))
              addPair(cmd, bg, pt.key, tagClass, pt.label);
          }
        }

      } else if (pt.pairingRule === 'doctor') {
        for (const comp of group) {
          for (const doc of doctors) {
            if (isSubsetOfTarget(colorId(doc)) && isExactTarget(unionId(colorId(comp), colorId(doc))))
              addPair(comp, doc, pt.key, tagClass, pt.label);
          }
        }
      }
    }

    document.getElementById('spinner').style.display = 'none';
    const totalPairs = [...groupMap.values()].reduce((s, g) => s + g.partners.length, 0);
    setStatus(`Done — ${groupMap.size} anchor cards, ${totalPairs} pairings, ${soloCards.length} solo commanders.`);
    document.getElementById('controls').style.display = 'flex';
    renderAll();

  } catch(err) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status-text').textContent = 'Error fetching data.';
    document.getElementById('error-container').innerHTML = `<div class="error-msg">⚠ ${err.message}</div>`;
    console.error(err);
  }
}

// ── Mechanic scanner ──────────────────────────────────────────────────────────

const SCAN_CACHE_KEY = 'mechanic-scan-v1';
const SCAN_CACHE_TTL = 7 * 24 * 60 * 60 * 1000;

async function scanForNewMechanics() {
  const cards = await fetchAll('o:"partner—"');
  const found = new Set();
  for (const card of cards)
    for (const m of oracleText(card).matchAll(/partner—([^\n(,]+)/g))
      found.add(m[1].trim());
  const known = new Set(PARTNER_TYPES.filter(pt => pt.namedSubtype).map(pt => pt.namedSubtype));
  return {
    found: [...found].sort(),
    unknown: [...found].filter(s => !known.has(s)).sort(),
  };
}

function applyScanResult(unknown, timestamp) {
  const btn = document.getElementById('scan-btn');
  const result = document.getElementById('scan-result');
  const daysAgo = Math.floor((Date.now() - timestamp) / (1000 * 60 * 60 * 24));
  const age = daysAgo === 0 ? 'just now' : `${daysAgo}d ago`;

  if (unknown.length === 0) {
    btn.textContent = `✓ All mechanics up to date (checked ${age})`;
    btn.style.color = 'rgba(122,208,154,0.55)';
    result.innerHTML = '';
  } else {
    btn.textContent = `⚠ ${unknown.length} unknown mechanic${unknown.length !== 1 ? 's' : ''} found — click to re-scan`;
    btn.style.color = 'rgba(224,176,106,0.85)';
    result.innerHTML = `<span class="scan-warn">Found: ${unknown.map(s => `<strong>partner—${s}</strong>`).join(', ')}<br>
      <small>Ask Claude Code to add these to PARTNER_TYPES in index.html.</small></span>`;
  }
}

async function runMechanicScan() {
  const btn = document.getElementById('scan-btn');
  const result = document.getElementById('scan-result');
  btn.disabled = true;
  btn.textContent = 'Scanning Scryfall…';
  btn.style.color = '';
  result.innerHTML = '';
  try {
    const { unknown } = await scanForNewMechanics();
    const timestamp = Date.now();
    localStorage.setItem(SCAN_CACHE_KEY, JSON.stringify({ timestamp, unknown }));
    applyScanResult(unknown, timestamp);
  } catch(e) {
    result.innerHTML = `<span class="scan-warn">Scan error: ${e.message}</span>`;
    btn.textContent = 'Scan Scryfall for unknown partner mechanics';
    btn.style.color = '';
  }
  btn.disabled = false;
}

(function autoScanOnLoad() {
  try {
    const cached = localStorage.getItem(SCAN_CACHE_KEY);
    if (cached) {
      const { timestamp, unknown } = JSON.parse(cached);
      applyScanResult(unknown, timestamp);
      if (Date.now() - timestamp < SCAN_CACHE_TTL) return;
    }
  } catch(e) {}
  setTimeout(async () => {
    try {
      const { unknown } = await scanForNewMechanics();
      const timestamp = Date.now();
      localStorage.setItem(SCAN_CACHE_KEY, JSON.stringify({ timestamp, unknown }));
      applyScanResult(unknown, timestamp);
    } catch(e) {}
  }, 2000);
})();

// ── Render helpers ────────────────────────────────────────────────────────────

function getIndex(id) { return partnerIndex.get(id) || 0; }
function setIndex(id, i) { partnerIndex.set(id, i); }

function pipHtml(idSet) {
  if (idSet.size === 0) {
    const d = COLOR_DATA['C'];
    return `<div class="identity-pips"><span class="ipip" style="background:${d.bg};color:${d.fg}">C</span></div>`;
  }
  return '<div class="identity-pips">' +
    COLOR_ORDER.map(c => c.toLowerCase()).filter(c => idSet.has(c)).map(c => {
      const d = COLOR_DATA[c.toUpperCase()];
      return `<span class="ipip" style="background:${d.bg};color:${d.fg}">${c.toUpperCase()}</span>`;
    }).join('') + '</div>';
}

function combinedPipHtml(idSet) {
  if (idSet.size === 0) {
    const d = COLOR_DATA['C'];
    return `<span class="cpip" style="background:${d.bg};color:${d.fg}">C</span>`;
  }
  return COLOR_ORDER.map(c => c.toLowerCase()).filter(c => idSet.has(c)).map(c => {
    const d = COLOR_DATA[c.toUpperCase()];
    return `<span class="cpip" style="background:${d.bg};color:${d.fg}">${c.toUpperCase()}</span>`;
  }).join('');
}

function cardBlockHtml(card, width) {
  const img = imgUri(card);
  const large = imgUriLarge(card);
  return `<div class="card-block">
    ${img
      ? `<img src="${img}" data-large="${large||img}" alt="${card.name}" width="${width}" loading="lazy"
             onclick="openLightbox(event,this.dataset.large,this.alt)">`
      : `<div class="img-placeholder" style="width:${width}px">No image</div>`}
    <a class="scryfall-btn" href="${scryfallUrl(card.name)}" target="_blank">Scryfall ↗</a>
  </div>`;
}

function partnerDisplayHtml(group, idx) {
  const partner = group.partners[idx];
  const combined = unionId(colorId(group.anchor), colorId(partner));
  const img = imgUri(partner);
  const large = imgUriLarge(partner);

  return `
    ${img
      ? `<div class="card-block"><img src="${img}" data-large="${large||img}" alt="${partner.name}" width="195" loading="lazy"
             onclick="openLightbox(event,this.dataset.large,this.alt)"></div>`
      : `<div class="card-block"><div class="img-placeholder" style="width:195px">No image</div></div>`}
    <div class="partner-info">
      <div class="pname">${partner.name}</div>
      <div class="ptype">${(partner.type_line||'').replace('Legendary Creature — ','').replace('Legendary Planeswalker — ','')}</div>
      <div class="pmechanic-row">
        <span class="mechanic-tag ${group.tagClass}">${group.tagLabel}</span>
        ${pipHtml(colorId(partner))}
      </div>
      <div class="combined-label">Combined identity:</div>
      <div class="combined-pips">${combinedPipHtml(combined)}</div>
      <a class="scryfall-btn" href="${scryfallUrl(partner.name)}" target="_blank" style="margin-top:0.4rem">View on Scryfall ↗</a>
    </div>`;
}

function groupDrawerInnerHtml(gid, group) {
  const idx = getIndex(gid);
  const total = group.partners.length;
  const escapedGid = gid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `
    <div class="drawer-inner">
      <div class="panel-anchor">
        ${cardBlockHtml(group.anchor, 200)}
        <div class="card-label">${group.anchor.name}</div>
      </div>
      <div class="panel-partner">
        <div class="partner-nav">
          <button class="nav-btn" onclick="step(event,'${escapedGid}', -1)" ${idx===0?'disabled':''} title="Previous (↑)">↑</button>
          <span class="nav-label"><strong>${idx+1}</strong> of <strong>${total}</strong> partner${total!==1?'s':''}</span>
          <button class="nav-btn" onclick="step(event,'${escapedGid}', 1)" ${idx===total-1?'disabled':''} title="Next (↓)">↓</button>
          <span class="key-hint">↑ ↓ keys</span>
        </div>
        <div class="partner-display" id="pdisplay-${CSS.escape(gid)}">
          ${partnerDisplayHtml(group, idx)}
        </div>
      </div>
    </div>`;
}

// ── Row view rendering ────────────────────────────────────────────────────────

function groupRowHtml(gid, group) {
  const total = group.partners.length;
  const isOpen = activeGroupId === gid;
  const preview = group.partners.slice(0,3).map(p=>`<em>${p.name}</em>`).join(', ')
                + (total > 3 ? `, +${total-3} more` : '');
  const escapedGid = gid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

  return `
    <div class="group-item${isOpen?' open':''}" id="group-${CSS.escape(gid)}"
         tabindex="0"
         onclick="toggleGroup(event,'${escapedGid}')"
         onkeydown="handleKey(event,'${escapedGid}')">
      <div class="group-header">
        <span class="anchor-name">${group.anchor.name}</span>
        <span class="partner-preview">${preview}</span>
        <div class="group-badges">
          <span class="partner-counter">${total} partner${total!==1?'s':''}</span>
          <span class="mechanic-tag ${group.tagClass}">${group.tagLabel}</span>
          ${pipHtml(colorId(group.anchor))}
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="group-drawer">${isOpen ? groupDrawerInnerHtml(gid, group) : ''}</div>
    </div>`;
}

function soloGroupHtml(card) {
  const gid = 'solo::' + card.id;
  const isOpen = activeGroupId === gid;
  const escapedGid = gid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `
    <div class="group-item${isOpen?' open':''}" id="group-${CSS.escape(gid)}"
         tabindex="0"
         onclick="toggleGroup(event,'${escapedGid}')"
         onkeydown="handleKey(event,'${escapedGid}')">
      <div class="group-header">
        <span class="anchor-name">${card.name}</span>
        <span class="partner-preview" style="color:rgba(245,240,232,0.3)">Solo — no partner needed</span>
        <div class="group-badges">
          <span class="mechanic-tag tag-solo">Solo</span>
          ${pipHtml(colorId(card))}
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="group-drawer">${isOpen ? soloDrawerHtml(card) : ''}</div>
    </div>`;
}

function soloDrawerHtml(card) {
  return `<div class="solo-drawer-inner">
    ${cardBlockHtml(card, 200)}
    <div class="partner-info">
      <div class="pname">${card.name}</div>
      <div class="ptype">${(card.type_line||'').replace('Legendary Creature — ','').replace('Legendary Planeswalker — ','')}</div>
      <div class="combined-label" style="margin-top:0.5rem">Color identity:</div>
      <div class="combined-pips">${combinedPipHtml(colorId(card))}</div>
      <a class="scryfall-btn" href="${scryfallUrl(card.name)}" target="_blank" style="margin-top:0.5rem">Scryfall ↗</a>
    </div>
  </div>`;
}

// ── Card grid view rendering ──────────────────────────────────────────────────

function cardGridItemHtml(gid, group) {
  const img = imgUri(group.anchor);
  const large = imgUriLarge(group.anchor);
  const total = group.partners.length;
  const escapedGid = gid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `
    <div class="card-grid-item" onclick="openGroupModal('${escapedGid}')">
      ${img
        ? `<img src="${img}" data-large="${large||img}" alt="${group.anchor.name}" loading="lazy"
               onclick="openLightbox(event,this.dataset.large,this.alt)">`
        : `<div class="card-grid-placeholder">No image</div>`}
      <div class="grid-name">${group.anchor.name}</div>
      <div class="grid-badges">
        <span class="mechanic-tag ${group.tagClass}">${group.tagLabel}</span>
        <span class="partner-counter">${total} partner${total!==1?'s':''}</span>
        ${pipHtml(colorId(group.anchor))}
      </div>
    </div>`;
}

function soloCardGridItemHtml(card) {
  const img = imgUri(card);
  const large = imgUriLarge(card);
  const gid = 'solo::' + card.id;
  const escapedGid = gid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `
    <div class="card-grid-item" onclick="openGroupModal('${escapedGid}')">
      ${img
        ? `<img src="${img}" data-large="${large||img}" alt="${card.name}" loading="lazy"
               onclick="openLightbox(event,this.dataset.large,this.alt)">`
        : `<div class="card-grid-placeholder">No image</div>`}
      <div class="grid-name">${card.name}</div>
      <div class="grid-badges">
        <span class="mechanic-tag tag-solo">Solo</span>
        ${pipHtml(colorId(card))}
      </div>
    </div>`;
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderAll() {
  const typeFilter   = document.getElementById('filter-type').value;
  const searchFilter = document.getElementById('filter-search').value.toLowerCase().trim();

  const filteredGroups = [...groupMap.entries()].filter(([gid, group]) => {
    if (typeFilter !== 'all' && typeFilter !== 'solo' && group.type !== typeFilter) return false;
    if (typeFilter === 'solo') return false;
    if (searchFilter && !group.anchor.name.toLowerCase().includes(searchFilter) &&
        !group.partners.some(p => p.name.toLowerCase().includes(searchFilter))) return false;
    return true;
  });

  const filteredSolo = soloCards.filter(c => {
    if (typeFilter !== 'all' && typeFilter !== 'solo') return false;
    if (searchFilter && !c.name.toLowerCase().includes(searchFilter)) return false;
    return true;
  });

  const total = filteredGroups.length + filteredSolo.length;
  document.getElementById('count-badge').textContent = `${total} anchor${total!==1?'s':''}`;

  const isCard = viewMode === 'card';
  let html = '';

  for (const type of typeOrder) {
    if (typeFilter !== 'all' && typeFilter !== type) continue;
    const sec = filteredGroups.filter(([,g]) => g.type === type);
    if (!sec.length) continue;
    const meta = sectionMeta[type];
    html += `
      <div class="section">
        <div class="section-header">
          <span class="section-title">${meta.label}</span>
          <span class="section-count">${sec.length} anchor${sec.length!==1?'s':''}</span>
        </div>
        ${isCard
          ? `<div class="card-grid">${sec.map(([gid,g]) => cardGridItemHtml(gid,g)).join('')}</div>`
          : `<div class="groups-list">${sec.map(([gid,g]) => groupRowHtml(gid,g)).join('')}</div>`}
      </div>`;
  }

  if ((typeFilter === 'all' || typeFilter === 'solo') && filteredSolo.length) {
    html += `
      <div class="section">
        <div class="section-header">
          <span class="section-title">Solo Commanders</span>
          <span class="section-count">${filteredSolo.length} cards</span>
        </div>
        ${isCard
          ? `<div class="card-grid">${filteredSolo.map(c => soloCardGridItemHtml(c)).join('')}</div>`
          : `<div class="groups-list">${filteredSolo.map(c => soloGroupHtml(c)).join('')}</div>`}
      </div>`;
  }

  document.getElementById('output').innerHTML = html || '<div class="empty-state">No results match your filters.</div>';
}

// ── Row view interaction ──────────────────────────────────────────────────────

function toggleGroup(event, gid) {
  if (event && (event.target.tagName === 'A' || event.target.tagName === 'BUTTON' || event.target.tagName === 'IMG')) return;
  const el = document.getElementById('group-' + CSS.escape(gid));
  if (!el) return;
  const wasOpen = el.classList.contains('open');

  if (wasOpen) {
    activeGroupId = null;
    el.classList.remove('open');
    el.querySelector('.group-drawer').innerHTML = '';
  } else {
    if (activeGroupId) {
      const prev = document.getElementById('group-' + CSS.escape(activeGroupId));
      if (prev) { prev.classList.remove('open'); prev.querySelector('.group-drawer').innerHTML = ''; }
    }
    activeGroupId = gid;
    el.classList.add('open');
    const drawer = el.querySelector('.group-drawer');
    const group = groupMap.get(gid);
    if (group) {
      drawer.innerHTML = groupDrawerInnerHtml(gid, group);
    } else {
      const card = soloCards.find(c => 'solo::' + c.id === gid);
      if (card) drawer.innerHTML = soloDrawerHtml(card);
    }
    el.focus({ preventScroll: true });
  }
}

// step() uses element IDs so it works both in row drawers and the group modal
function step(event, gid, dir) {
  event.stopPropagation();
  const group = groupMap.get(gid);
  if (!group) return;
  const cur = getIndex(gid);
  const next = Math.max(0, Math.min(group.partners.length - 1, cur + dir));
  if (next === cur) return;
  setIndex(gid, next);

  const display = document.getElementById('pdisplay-' + CSS.escape(gid));
  if (!display) return;

  const navPanel = display.closest('.panel-partner');
  const btns = navPanel ? navPanel.querySelectorAll('.nav-btn') : [];
  if (btns[0]) btns[0].disabled = (next === 0);
  if (btns[1]) btns[1].disabled = (next === group.partners.length - 1);

  const label = navPanel ? navPanel.querySelector('.nav-label') : null;
  if (label) label.innerHTML = `<strong>${next+1}</strong> of <strong>${group.partners.length}</strong> partner${group.partners.length!==1?'s':''}`;

  display.style.opacity = '0';
  setTimeout(() => {
    display.innerHTML = partnerDisplayHtml(group, next);
    display.style.opacity = '1';
  }, 110);
}

function handleKey(event, gid) {
  const el = document.getElementById('group-' + CSS.escape(gid));
  if (!el) return;
  const isOpen = el.classList.contains('open');

  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault(); toggleGroup(event, gid);
  } else if (isOpen && event.key === 'ArrowDown') {
    event.preventDefault(); step(event, gid, 1);
  } else if (isOpen && event.key === 'ArrowUp') {
    event.preventDefault(); step(event, gid, -1);
  } else if (isOpen && event.key === 'Escape') {
    event.preventDefault(); toggleGroup(event, gid);
  }
}

// ── Group modal (card view) ───────────────────────────────────────────────────

let modalGid = null;

function openGroupModal(gid) {
  modalGid = gid;
  const group = groupMap.get(gid);
  const modal = document.getElementById('group-modal');
  const body = document.getElementById('group-modal-body');
  const title = document.getElementById('group-modal-title');

  if (group) {
    title.textContent = group.anchor.name;
    body.innerHTML = groupDrawerInnerHtml(gid, group);
  } else {
    const card = soloCards.find(c => 'solo::' + c.id === gid);
    if (!card) return;
    title.textContent = card.name;
    body.innerHTML = soloDrawerHtml(card);
  }

  modal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeGroupModal() {
  document.getElementById('group-modal').classList.add('hidden');
  document.body.style.overflow = '';
  modalGid = null;
}

function onModalOverlayClick(event) {
  if (event.target === document.getElementById('group-modal')) closeGroupModal();
}

// ── Lightbox ──────────────────────────────────────────────────────────────────

function openLightbox(event, src, alt) {
  event.stopPropagation();
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  img.src = src;
  img.alt = alt || '';
  lb.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden');
  document.getElementById('lightbox-img').src = '';
  // Only restore scroll if no modal is open
  if (document.getElementById('group-modal').classList.contains('hidden')) {
    document.body.style.overflow = '';
  }
}

// Global ESC handler
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!document.getElementById('lightbox').classList.contains('hidden')) {
      closeLightbox();
    } else if (!document.getElementById('group-modal').classList.contains('hidden')) {
      closeGroupModal();
    }
  }
});
</script>
